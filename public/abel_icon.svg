<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e180a" />
      <stop offset="60%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#020305" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Dark Gold Bevel Gradient -->
    <linearGradient id="darkGoldBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glowing Core Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle / Hexagon Container for Desktop Icon -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#goldMetal)" stroke-width="8" filter="url(#shadowFilter)" />

  <!-- Outer Cybernetic Circuit Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="12 8" opacity="0.4" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.3" />

  <!-- Hexagonal Core Shield -->
  <polygon points="256,96 384,170 384,318 256,392 128,318 128,170" fill="#0b0d14" stroke="url(#darkGoldBevel)" stroke-width="10" />

  <!-- Inner Hexagon Accent -->
  <polygon points="256,116 364,178 364,302 256,364 148,302 148,178" fill="none" stroke="url(#goldMetal)" stroke-width="4" opacity="0.8" />

  <!-- Bold Geometric 'A' Glyph for Abel AI -->
  <!-- Left Stems and Right Stems -->
  <path d="M256 140 L340 330 L300 330 L275 270 L237 270 L212 330 L172 330 Z" fill="url(#goldMetal)" filter="url(#goldGlow)" />

  <!-- Inner Triangular Cutout of the 'A' -->
  <polygon points="256,195 244,235 268,235" fill="#0b0d14" />

  <!-- Glowing Core Power Pulse -->
  <circle cx="256" cy="252" r="14" fill="#ffffff" filter="url(#goldGlow)" />
  <circle cx="256" cy="252" r="7" fill="#fef08a" />

  <!-- Lower Abel AI Text Brand Bar -->
  <rect x="176" y="420" width="160" height="26" rx="13" fill="#000000" stroke="#f59e0b" stroke-width="2" opacity="0.9" />
  <text x="256" y="438" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="3">ABEL AI</text>
</svg>
